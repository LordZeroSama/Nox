title    Nox OS (mode sans echec graphique)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%NOX_KERNEL%
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-%NOX_KERNEL%.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nouveau systemd.unit=multi-user.target
