#
# Nox OS - pacman configuration used ONLY at build time (not copied into the image).
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Local repository with packages built from the AUR (legacy NVIDIA driver).
# build.sh replaces this block with the real path, or removes it for variants
# that do not need it.
#%NOX_LOCALREPO_BLOCK%
