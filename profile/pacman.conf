#
# Nox OS - pacman configuration used ONLY at build time (not copied into the image).
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Local repository: Nox packages (packages/*) and AUR builds (legacy NVIDIA driver).
# build.sh replaces this line with the real path.
#%NOX_LOCALREPO_BLOCK%
