# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=archlinux
timeout=5
timeout_style=menu


# Menu entries

menuentry "Nox OS (RAM - recommande, 8 Go+)" --class arch --class gnu-linux --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%NOX_KERNEL% archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-%NOX_KERNEL%.img
}

menuentry "Nox OS (lecture disque - PC avec moins de 8 Go)" --class arch --class gnu-linux --class os --id 'nox-disk' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%NOX_KERNEL% archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-%NOX_KERNEL%.img
}

menuentry "Nox OS (mode sans echec graphique)" --class arch --class gnu-linux --class os --id 'nox-safe' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%NOX_KERNEL% archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nouveau systemd.unit=multi-user.target
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-%NOX_KERNEL%.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'Parametres UEFI (BIOS)' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Eteindre' --class shutdown --class poweroff {
    halt
}

menuentry 'Redemarrer' --class reboot --class restart {
    reboot
}
