LABEL nox-ram
MENU LABEL Nox OS (RAM - recommande, 8 Go+)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%NOX_KERNEL%
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-%NOX_KERNEL%.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y %KERNEL_PARAMS%

LABEL nox-disk
MENU LABEL Nox OS (lecture disque - moins de 8 Go)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%NOX_KERNEL%
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-%NOX_KERNEL%.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n %KERNEL_PARAMS%

LABEL nox-safe
MENU LABEL Nox OS (mode sans echec graphique)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%NOX_KERNEL%
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-%NOX_KERNEL%.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nouveau systemd.unit=multi-user.target
