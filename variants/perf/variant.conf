# Variant "perf": tuned for the ASUS K501LX (Intel HD 5500 + NVIDIA GTX 950M).
NOX_KERNEL="linux-zen"
# Extra kernel parameters. To validate before enabling:
#   mitigations=off  -> noticeable CPU gain on Broadwell, but weaker protection
#                       against Spectre/Meltdown-type attacks (browser included).
NOX_KERNEL_PARAMS="quiet loglevel=3 nvidia_drm.modeset=1"
# Packages built from the AUR into the local repository (see scripts/build-aur.sh)
NOX_AUR_PACKAGES=(nvidia-580xx-utils)
