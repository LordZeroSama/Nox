name: Build Nox OS ISO

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build"
        type: choice
        options: [perf, generic]
        default: perf

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Build ISO in an Arch Linux container
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/build" \
            archlinux:latest \
            bash /build/ci/build-in-container.sh "${{ inputs.variant }}"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nox-os-${{ inputs.variant }}
          path: out/*.iso
          compression-level: 0
          retention-days: 7
