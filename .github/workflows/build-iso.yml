name: Build Nox OS ISO

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build"
        type: choice
        options: [perf, generic]
        default: perf

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check the Windows updater script syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/windows/Mettre-a-jour-Nox.bat", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Build ISO in an Arch Linux container
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/build" \
            archlinux:latest \
            bash /build/ci/build-in-container.sh "${{ inputs.variant }}"

      # GitHub release assets are limited to 2 GiB each: the ISO is split in parts.
      # The Windows updater (windows/Mettre-a-jour-Nox.bat) downloads and joins them.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          iso="$(ls nox-os-*.iso)"
          sudo chown "$(id -u)" "$iso"
          tag="${{ inputs.variant }}-$(date -u +%Y%m%d-%H%M)"
          sha256sum "$iso" | awk '{print $1}' > "$iso.sha256"
          split -b 1900M -d -a 2 "$iso" "$iso.part"
          rm "$iso"
          gh release create "$tag" ./*.part* "$iso.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nox OS ${{ inputs.variant }} ($tag)" \
            --notes "Image ${{ inputs.variant }} construite depuis ${GITHUB_SHA::7}. Installation : windows/Mettre-a-jour-Nox.bat"
